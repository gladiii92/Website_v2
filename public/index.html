    <meta http-equiv="refresh" content="0; url=/de" />
    <title>Redirecting...</title>

  <body>
    <script>
      var lang = navigator.language.split('-')[0];
      var supported = ['de', 'en', 'fr'];
      var target = supported.includes(lang) ? lang : 'de';
      window.location.replace('/' + target);
    </script>
  </body>
